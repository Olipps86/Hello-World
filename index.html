<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Bienvenida</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ff6347;
        }
        .description {
            font-size: 1.2em;
            margin: 20px 0;
        }
        .buttons {
            margin-top: 30px;
        }
        a {
            background-color: #4CAF50;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
            display: inline-block;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>¡Bienvenido a mi repositorio!</h1>
    <p class="description">Este es un proyecto llamado Hello-World donde exploramos conceptos básicos de HTML, CSS y JavaScript.</p>
    <div class="buttons">
        <a href="https://github.com/Olipps86/Hello-World">Visita el repositorio</a>
        <a href="https://github.com/Olipps86/Hello-World/issues">Reporta un problema</a>
    </div>
</body>
</html>
